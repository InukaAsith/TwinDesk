<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Remote</title>
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <header id="top">
    <span id="name" data-i18n>Remote</span>
    <button id="b-rotate" class="pad-only" aria-label="Rotate" data-i18n>Rotate</button>
    <button id="b-kbd" class="pad-only" aria-label="Keyboard" data-i18n>Keyboard</button>
    <button id="b-map" class="game-only" aria-label="Keys" data-i18n>Keys</button>
    <button id="b-close" aria-label="Close">✕</button>
  </header>
  <div id="note" hidden><span id="note-text"></span><button id="note-on" hidden data-i18n>Turn on Remote</button></div>

  <!-- Touchpad and keyboard -->
  <section id="pad-view" class="pad-only">
    <div id="keys"></div>
    <div id="pad"><span><span data-i18n>Slide to move · tap to click · hold to right click</span><br><span data-i18n>two fingers to scroll · two-finger tap to right click</span></span></div>
    <div id="clicks">
      <button id="b-left" data-i18n>Left click</button>
      <button id="b-right" data-i18n>Right click</button>
    </div>
  </section>

  <!-- Gamepad: each button presses the key set for it (Keys), or is a real controller's -->
  <section id="game" class="game-only">
    <button class="g shoulder trigger" id="g-lt" data-id="lt">LT</button>
    <button class="g shoulder bumper" id="g-lb" data-id="lb">LB</button>
    <button class="g shoulder bumper" id="g-rb" data-id="rb">RB</button>
    <button class="g shoulder trigger" id="g-rt" data-id="rt">RT</button>
    <button class="g small" id="g-back" data-id="back" data-i18n="gamepad|Back">Back</button>
    <button class="g small" id="g-start" data-id="start" data-i18n="gamepad|Start">Start</button>
    <div class="stick" id="ls"><div class="knob"></div></div>
    <div class="stick" id="rs"><div class="knob"></div></div>
    <div id="dpad">
      <button class="g" data-id="up" aria-label="Up">▲</button>
      <button class="g" data-id="left" aria-label="Left">◀</button>
      <button class="g" data-id="right" aria-label="Right">▶</button>
      <button class="g" data-id="down" aria-label="Down">▼</button>
    </div>
    <div id="abxy">
      <button class="g face y" data-id="y">Y</button>
      <button class="g face x" data-id="x">X</button>
      <button class="g face b" data-id="b">B</button>
      <button class="g face a" data-id="a">A</button>
    </div>
    <button class="g small" id="g-l3" data-id="l3">L3</button>
    <button class="g small" id="g-r3" data-id="r3">R3</button>
    <div id="pad-note" hidden></div>
  </section>

  <!-- The gamepad's keys: what each control presses (Remote.kt keeps them) -->
  <div id="map" class="game-only" hidden>
    <header><b data-i18n>Gamepad keys</b><button id="map-reset" data-i18n>Reset</button><button id="map-done" data-i18n>Done</button></header>
    <p class="hint" id="map-hint"></p>
    <div id="map-list"></div>
  </div>

  <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  <script src="remote.js"></script>
</body>
</html>
