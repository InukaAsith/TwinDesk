<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title data-i18n="call.windowTitle">Call</title>
  <link rel="stylesheet" href="phonehub.css">
</head>
<body class="callpop">
  <div class="cp">
    <div id="avatar" class="cp-avatar" aria-hidden="true"></div>
    <div class="cp-text">
      <div id="who" class="cp-who"></div>
      <div id="sub" class="cp-sub"></div>
    </div>
    <div class="cp-buttons">
      <button id="silence" class="cp-btn" title="Silence" data-i18n-title="Silence" data-i18n-label="Silence" hidden></button>
      <button id="hold" class="cp-btn" title="Hold" data-i18n-title="Hold" data-i18n-label="Hold" hidden></button>
      <button id="mute" class="cp-btn" title="Mute" data-i18n-title="Mute" data-i18n-label="Mute" hidden></button>
      <button id="where" class="cp-btn" title="" hidden></button>
      <button id="decline" class="cp-btn bad" title="Decline" data-i18n-title="Decline" data-i18n-label="Decline" hidden></button>
      <button id="answer" class="cp-btn good" title="Answer" data-i18n-title="Answer" data-i18n-label="Answer" hidden></button>
      <button id="end" class="cp-btn bad" title="End" data-i18n-title="End" data-i18n-label="End" hidden></button>
    </div>
    <button id="close" class="cp-x" title="Hide" aria-label="Hide" data-i18n-title="Hide" data-i18n-label="Hide">×</button>
  </div>
  <script src="lang/en.js"></script>
  <script src="lang/zh-CN.js"></script>
  <script src="lang/ru.js"></script>
  <script src="lang/tr.js"></script>
  <script src="i18n.js"></script>
  <script src="player-i18n.js"></script>
  <script src="callpop.js"></script>
</body>
</html>
