<!doctype html>
<!-- TwinDesk Web — Screen Viewer (Desktop and iPad matching) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TwinDesk — Screen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: auto;
    }
    canvas#framegen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Floating desktop top bar */
    #bar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, 0);
      transition: transform 0.24s cubic-bezier(0.2, 0.85, 0.32, 1.2), opacity 0.2s ease;
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 5px 8px;
      border-radius: 12px;
      background: rgba(28, 28, 30, 0.82);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      color: #f3f3f5;
      cursor: default;
      user-select: none;
      z-index: 100;
    }
    #bar.hidden {
      transform: translate(-50%, -74px);
      opacity: 0;
      pointer-events: none;
    }
    .bar-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #f3f3f5;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.12s ease;
      white-space: nowrap;
    }
    .bar-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .bar-btn.on {
      background: #0a84ff;
      color: #ffffff;
    }
    .bar-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bar-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 4px;
    }
    .bar-pill {
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(48, 185, 77, 0.2);
      color: #32d74b;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    #overlay {
      position: absolute;
      color: #98989d;
      font-size: 15px;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="bar">
      <a id="btn-bar-back" href="index.html" class="bar-btn" title="Exit viewer">
        <svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"></path></svg>
        <span>Exit</span>
      </a>
      <span class="bar-sep"></span>
      <button id="btn-bar-mirror" class="bar-btn on" type="button">Mirror</button>
      <button id="btn-bar-extend" class="bar-btn" type="button">Extend</button>
      <span class="bar-sep"></span>
      <button id="btn-bar-fg" class="bar-btn" type="button">Frame gen</button>
      <button id="btn-bar-full" class="bar-btn" type="button">Full screen</button>
      <span class="bar-sep"></span>
      <span id="bar-status" class="bar-pill">Connected</span>
    </div>

    <div id="overlay">Connecting to screen stream…</div>
    <video id="screen-video" autoplay playsinline muted></video>
    <canvas id="framegen" style="display: none;"></canvas>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
