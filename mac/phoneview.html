<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'">
  <title data-i18n="Phone">Phone</title>
  <link rel="stylesheet" href="phoneview.css">
</head>
<body>
  <header id="bar">
    <span id="title"></span>
    <span id="via" hidden></span>
    <span class="tools">
      <button id="b-back" title="Back (Esc)" data-i18n-title="Back (Esc)" aria-label="Back" data-i18n-label="Back"><svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
      <button id="b-home" title="Home" data-i18n-title="Home" aria-label="Home" data-i18n-label="Home"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5"/></svg></button>
      <button id="b-recents" title="Recent apps" data-i18n-title="Recent apps" aria-label="Recent apps" data-i18n-label="Recent apps"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg></button>
      <button id="b-notifs" title="Notifications" data-i18n-title="Notifications" aria-label="Notifications" data-i18n-label="Notifications"><svg viewBox="0 0 20 20"><path d="M5.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5l1.5 1.5h-12z M8.5 16.5a1.5 1.5 0 0 0 3 0"/></svg></button>
      <button id="b-torch" title="Flashlight / Torch" data-i18n-title="Flashlight / Torch" aria-label="Torch" data-i18n-label="Torch"><svg viewBox="0 0 20 20"><path d="M7 3h6v4l-2 3v7H9v-7L7 7z"/></svg></button>
      <button id="b-flip" title="Switch Camera" data-i18n-title="Switch Camera" aria-label="Switch Camera" data-i18n-label="Switch Camera"><svg viewBox="0 0 20 20"><path d="M3 7h14 M14 4l3 3-3 3 M17 13H3 M6 10l-3 3 3 3"/></svg></button>
      <button id="b-zoomin" title="Zoom In" data-i18n-title="Zoom In" aria-label="Zoom In" data-i18n-label="Zoom In"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/><line x1="9" y1="6" x2="9" y2="12"/><line x1="6" y1="9" x2="12" y2="9"/></svg></button>
      <button id="b-zoomout" title="Zoom Out" data-i18n-title="Zoom Out" aria-label="Zoom Out" data-i18n-label="Zoom Out"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/><line x1="6" y1="9" x2="12" y2="9"/></svg></button>
    </span>
  </header>
  <main id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="status" data-i18n="Connecting to the phone…">Connecting to the phone…</div>
  </main>
  <script src="../shared/lang/en.js"></script>
  <script src="../shared/lang/zh-CN.js"></script>
  <script src="../shared/lang/ru.js"></script>
  <script src="../shared/lang/tr.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/player-i18n.js"></script>
  <script src="../shared/vcam-feed.js"></script>
  <script src="phoneview-renderer.js"></script>
</body>
</html>
