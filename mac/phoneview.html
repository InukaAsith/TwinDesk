<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'">
  <title>Phone</title>
  <link rel="stylesheet" href="phoneview.css">
</head>
<body>
  <header id="bar">
    <span id="title"></span>
    <span id="via" hidden></span>
    <span class="tools">
      <button id="b-back" title="Back (Esc)" aria-label="Back"><svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
      <button id="b-home" title="Home" aria-label="Home"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5"/></svg></button>
      <button id="b-recents" title="Recent apps" aria-label="Recent apps"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg></button>
      <button id="b-notifs" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 20 20"><path d="M5.5 13.5V9a4.5 4.5 0 0 1 9 0v4.5l1.5 1.5h-12z M8.5 16.5a1.5 1.5 0 0 0 3 0"/></svg></button>
      <button id="b-rotate" title="Rotate" aria-label="Rotate"><svg viewBox="0 0 20 20"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9 M4.5 3.5v3h3"/></svg></button>
      <button id="b-power" title="Turn phone screen off (saves battery) · Right-click for power key" aria-label="Turn screen off"><svg viewBox="0 0 20 20"><path d="M10 2.5v7 M6.2 5.2a6 6 0 1 0 7.6 0"/></svg></button>
      <button id="b-enter-send" class="active" title="Enter sends message (Shift+Enter for new line)" aria-label="Enter sends message"><svg viewBox="0 0 20 20"><path d="M3 10l14-6-4 6 4 6z M3 10h10"/></svg></button>
    </span>
  </header>
  <main id="stage">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="status">Connecting to the phone…</div>
  </main>
  <script src="phoneview-renderer.js"></script>
</body>
</html>
