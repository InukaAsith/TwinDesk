<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>PC — TwinDesk</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; cursor: none; }
    body.input-off #video { cursor: default; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9a9fa8;
      font: 15px/1.4 -apple-system, system-ui, sans-serif; pointer-events: none; user-select: none; }
    #overlay.hidden { display: none; }
    #fg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: none; }
    body.fg #fg { display: block; }
    body.fg #video { opacity: 0; }
    /* Toolbar: top centre, shows when the pointer reaches the top edge. */
    #bar { position: fixed; top: 8px; left: 50%; transform: translate(-50%, -64px); transition: transform .18s ease;
      display: flex; gap: 4px; align-items: center; padding: 4px; border-radius: 12px;
      background: rgba(40, 40, 44, .82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .35), inset 0 0 0 .5px rgba(255, 255, 255, .15);
      font: 12px/1 -apple-system, system-ui, sans-serif; color: #f2f2f7; cursor: default; z-index: 2; }
    #bar.show { transform: translate(-50%, 0); }
    #bar button { all: unset; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
    #bar button:hover { background: rgba(255, 255, 255, .12); }
    #bar button.on { background: rgba(10, 132, 255, .9); }
    #bar button[disabled] { opacity: .4; }
    #bar .sep { width: 1px; height: 16px; background: rgba(255, 255, 255, .18); margin: 0 2px; }
    #bar [hidden] { display: none; } /* all: unset would show them */
    #bar.hidden { display: none; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline disablepictureinpicture></video>
  <canvas id="fg"></canvas>
  <div id="overlay">Connecting to the PC…</div>
  <div id="bar" class="hidden">
    <button id="b-extend" title="Use this window as an extra screen of the other computer">Extend</button>
    <button id="b-mirror" title="Show the other computer’s main screen">Mirror</button>
    <span class="sep"></span>
    <button id="b-fg" title="Frame generation: fills in late or dropped frames">Frame generation</button>
    <button id="b-full" title="Full screen (Ctrl ⌘ F)">Full screen</button>
    <span class="sep"></span>
    <button id="b-stop" title="Stop sharing on the other computer">Stop</button>
  </div>
  <script src="../shared/protocol.js"></script>
  <script src="../shared/framegen.js"></script>
  <script src="pcview-renderer.js"></script>
</body>
</html>
