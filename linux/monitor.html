<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob: mediastream:">
  <title data-i18n="Monitor 2">Monitor 2</title>
  <link rel="stylesheet" href="monitor.css">
</head>
<body>
  <video id="video" autoplay muted playsinline disablepictureinpicture disableremoteplayback></video>
  <canvas id="framegen" class="hidden"></canvas>
  <audio id="audio" autoplay></audio>
  <div id="overlay" data-i18n="Waiting for the other computer…">Waiting for the other computer…</div>
  <pre id="stats" class="hidden"></pre>
  <div id="drop-status" class="hidden"></div>
  <div id="bar">
    <button id="b-extend" data-i18n="Extend" data-i18n-title="Use this window as an extra screen of the other computer" title="Use this window as an extra screen of the other computer" hidden>Extend</button>
    <button id="b-mirror" data-i18n="Mirror" data-i18n-title="Show the other computer’s main screen" title="Show the other computer’s main screen" hidden>Mirror</button>
    <span class="sep" id="sep-mode" hidden></span>
    <button id="b-fg" data-i18n="Frame generation" data-i18n-title="Frame generation: fills in late or dropped frames" title="Frame generation: fills in late or dropped frames">Frame generation</button>
    <button id="b-full" data-i18n="Full screen" data-i18n-title="Full screen (F11)" title="Full screen (F11)">Full screen</button>
    <span class="sep" id="sep-stop" hidden></span>
    <button id="b-stop" data-i18n="Stop" data-i18n-title="Stop sharing on the other computer" title="Stop sharing on the other computer" hidden>Stop</button>
  </div>
  <script src="../shared/lang/en.js"></script>
  <script src="../shared/lang/zh-CN.js"></script>
  <script src="../shared/lang/ru.js"></script>
  <script src="../shared/lang/tr.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/player-i18n.js"></script>
  <script src="../shared/protocol.js"></script>
  <script src="../shared/framegen.js"></script>
  <script src="monitor.js"></script>
  <script src="monitor-input.js"></script>
  <script src="monitor-drop.js"></script>
  <script src="monitor-apps.js"></script>
  <script src="monitor-bar.js"></script>
</body>
</html>
