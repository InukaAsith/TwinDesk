# TwinDesk — Copyright (C) 2026 inukaasith. GPL-3.0, see LICENSE.
# The iOS signing helper: signs TwinDesk for iPhone and iPad with the user's own Apple ID and
# installs it on a cabled, trusted device. See README.md here for exactly what it does and sends.
[package]
name = "twindesk-ios-signer"
version = "3.0.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[features]
# Off: the only thing this can sign is TwinDesk's own IPA, which it downloads itself from the
# project's GitHub releases. On: it also signs an IPA at a path the app gives it.
any-ipa = []

[dependencies]
isideload = { version = "=0.5.2", default-features = false, features = ["install", "tokio-mt"] }
idevice = { version = "0.1.61", default-features = false, features = ["ring", "usbmuxd", "misagent", "installation_proxy"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
zip = { version = "8.3", default-features = false, features = ["deflate"] }
zeroize = "1"
ring = "0.17"
base64 = "0.22"
hex = "0.4"
futures-util = "0.3"
rootcause = "0.12.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls", "http2", "system-proxy", "stream"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
