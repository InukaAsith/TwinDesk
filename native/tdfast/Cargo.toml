[package]
name = "tdfast"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "TwinDesk's input lane (docs/protocol.md): the wire of shared/inputlane.js, in the helpers"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_QoS", "Win32_Foundation"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
