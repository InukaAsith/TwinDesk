name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the files on (e.g. v2.0.1; made as a draft if it isn't there). Empty = run artifacts only.
        required: false
        default: ''
      ref:
        description: Branch to build (a test branch; releases come from main).
        required: false
        default: main
      virustotal:
        description: Scan the installers on VirusTotal (needs the VT_API_KEY secret; uploads are shared with its partners)
        type: boolean
        required: false
        default: false
      signing:
        description: SignPath signing policy (test-signing = self-signed test certificate; release-signing once the SignPath Foundation certificate is issued; none = unsigned)
        type: choice
        required: false
        default: test-signing
        options:
          - test-signing
          - release-signing
          - none

# Write: the full Android APK can come from a draft release, which a read-only token can't see.
# actions: read lets SignPath fetch the unsigned workflow artifact and check the run.
permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      # main unless another branch is asked for (ref), whichever branch the run was started from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/android-full
        with:
          keystore: ${{ secrets.ANDROID_KEYSTORE }}

      # The app's PowerShell scripts (ps.js runs only these): each one parses in Windows PowerShell.
      - name: Check the PowerShell scripts
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows/scripts/*.ps1, windows-helper/calls/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Output "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      # The input lane (native/tdfast) for the arm64 installer too: tdfast.cmd builds a tdfast.dll
      # per architecture, and the runner's Rust has only the x64 target.
      - name: Rust target for Windows on ARM
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install dependencies
        working-directory: windows
        run: npm install

      # The helper builds with .NET Framework's csc.exe, which the runner has. One AnyCPU helper
      # serves both installers.
      - name: Build the installers (x64 and arm64)
        working-directory: windows
        run: npm run dist -- x64 arm64
        env:
          # Optional Authenticode certificate. Store a base64-encoded PFX and its password
          # as repository secrets; the build fails if signing is configured but cannot complete.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Code signing by SignPath (free for open source, certificate by SignPath Foundation).
      # The unsigned installers go up as one workflow artifact; SignPath takes that zip, signs every
      # TwinDesk-Setup-*.exe in it (artifact configuration "initial" in the TwinDesk project) and the
      # signed copies come back into windows/signed/. SIGNPATH_API_TOKEN: the "CI builds" user's token.
      - name: Upload the unsigned installers for signing
        id: upload-unsigned
        if: inputs.signing != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-windows-unsigned
          path: windows/dist/TwinDesk-Setup-*.exe
          if-no-files-found: error

      - name: Sign the installers (SignPath)
        if: inputs.signing != 'none'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 2b49db71-b908-47a9-a6f8-5af028126e05
          project-slug: TwinDesk
          signing-policy-slug: ${{ inputs.signing }}
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: windows/signed

      # What gets published: the signed installers, or the build's own when signing is off.
      - name: Pick the installers to publish
        shell: bash
        run: |
          mkdir -p windows/out
          if [ "${{ inputs.signing }}" != "none" ]; then
            cp windows/signed/TwinDesk-Setup-*.exe windows/out/
          else
            cp windows/dist/TwinDesk-Setup-*.exe windows/out/
          fi
          ls -l windows/out

      - name: Upload the x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-windows-x64
          path: |
            windows/out/*.exe
            !windows/out/*-arm64.exe

      - name: Upload the arm64 installer
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-windows-arm64
          path: windows/out/*-arm64.exe

      # Straight onto the release, no download and re-upload.
      - name: Upload to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --draft --target main --title "${{ inputs.tag }}" --notes "" || true
          # A self-signed test signature is never published: until release-signing works the
          # release gets the unsigned installers (the test-signed ones stay in the run's artifacts).
          if [ "${{ inputs.signing }}" = "test-signing" ]; then files=windows/dist/TwinDesk-Setup-*.exe; else files=windows/out/*.exe; fi
          gh release upload "${{ inputs.tag }}" $files --clobber

  # The installers uploaded to VirusTotal and scanned: what each engine said goes in the run's
  # summary, with the link to the full report. VT_API_KEY: a free VirusTotal account's API key.
  virustotal:
    if: inputs.virustotal
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: twindesk-windows-*64
          path: dist

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          [ -n "$VT_API_KEY" ] || { echo "::error::No VT_API_KEY secret: gh secret set VT_API_KEY"; exit 1; }
          api() { curl -sS --fail-with-body -H "x-apikey: $VT_API_KEY" "$@"; }
          echo "## VirusTotal" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find dist -name '*.exe' | sort); do
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            # Over 32 MB: an upload URL of its own.
            url=$(api https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            id=$(api -F "file=@$f" "$url" | jq -r .data.id)
            echo "$name: uploaded ($sha), analysis $id"
            # Every engine within a few minutes; a big file sometimes takes longer.
            status=queued
            for i in $(seq 1 60); do
              status=$(api "https://www.virustotal.com/api/v3/analyses/$id" | jq -r .data.attributes.status)
              [ "$status" = completed ] && break
              sleep 20
            done
            a=$(api "https://www.virustotal.com/api/v3/analyses/$id")
            stats=$(echo "$a" | jq -r '.data.attributes.stats | "\(.malicious) malicious, \(.suspicious) suspicious, \(.undetected) undetected"')
            hits=$(echo "$a" | jq -r '.data.attributes.results | to_entries[] | select(.value.category == "malicious" or .value.category == "suspicious") | "- **\(.key)** (\(.value.category)): \(.value.result)"')
            echo "$name ($status): $stats"
            echo "$hits"
            printf '### %s\n%s (%s) · [report](https://www.virustotal.com/gui/file/%s)\n\n%s\n\n' "$name" "$stats" "$status" "$sha" "$hits" >> "$GITHUB_STEP_SUMMARY"
          done
