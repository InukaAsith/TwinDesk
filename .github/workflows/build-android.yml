name: Build Android

# release.yml calls this for pull requests and merges to main (version, code and release_tag set).
# Pushing a v* tag, or running it by hand with a tag, builds that ref and puts the files on that release.
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      code:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the files on (e.g. v2.1.0). Empty = run artifacts only.
        required: false
        default: ''
      ref:
        description: Branch to build (a test branch; releases come from main).
        required: false
        default: main

# Write: the files can go straight onto a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || inputs.tag }}

    steps:
      # Build the pushed tag or branch, or the ref selected for a manual run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set the version
        if: inputs.version != ''
        run: bash .github/scripts/set-version.sh "${{ inputs.version }}" "${{ inputs.code }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Signed with the ANDROID_KEYSTORE secret when it's there, so the APKs install over the ones
      # people already have (and the computers can install the full one over the standard one).
      # Without it they're signed with this runner's own debug key: fine to try, but they won't
      # install over a build signed with yours.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # One fixed key for every build of this repository (not a secret: anyone could sign with it, so
            # add the ANDROID_KEYSTORE secret to replace it). Without a fixed key each runner makes its
            # own, and Android refuses an update signed differently from the installed app.
            echo "::warning::No ANDROID_KEYSTORE secret: signed with the repository's shared key (.github/android-shared.keystore)"
            mkdir -p ~/.android
            cp .github/android-shared.keystore ~/.android/debug.keystore
          else
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build the standard and full APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          v=$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/TwinDesk-$v.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/TwinDesk-$v-full.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-android
          path: android/dist/TwinDesk-*.apk

      # The computers' installers carry the full APK (installed over the phone's app through wireless
      # debugging): the Windows and Mac jobs of the same run take it from here.
      - name: Keep the full APK for the desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: android-full-apk
          path: android/dist/TwinDesk-*-full.apk

      # Straight onto the release, no download and re-upload.
      - name: Upload to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest || true
          gh release upload "$TAG" android/dist/TwinDesk-*.apk --clobber
