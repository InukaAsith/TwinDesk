# The full Android build (notification access) that the computers install over the downloaded app
# through wireless debugging. It has to be signed with the same key as that app, so:
#   - with the ANDROID_KEYSTORE secret (base64 of that keystore) it's built here;
#   - without it, it's taken from the newest release that carries TwinDesk-<version>-full.apk
#     (built and signed on the developer's machine), drafts included.
# Either way it lands in android/dist, where the installers pick it up.
name: Android full build
inputs:
  keystore:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Signing key
      id: key
      shell: bash
      env:
        KEYSTORE: ${{ inputs.keystore }}
      run: |
        if [ -z "$KEYSTORE" ]; then
          echo "have=false" >> "$GITHUB_OUTPUT"
        else
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          echo "have=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.key.outputs.have == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - if: steps.key.outputs.have == 'true'
      name: Build the full APK into android/dist
      shell: bash
      working-directory: android
      run: |
        ./gradlew --no-daemon assembleFullRelease
        mkdir -p dist
        cp app/build/outputs/apk/full/release/app-full-release.apk "dist/TwinDesk-$(grep -m1 versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')-full.apk"
        ls -la dist

    - if: steps.key.outputs.have != 'true'
      name: Take the full APK from a release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        v=$(grep -m1 versionName android/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        apk="TwinDesk-$v-full.apk"
        for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName -q '.[].tagName'); do
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$apk"; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$apk" -D android/dist --clobber
            echo "$apk from release $tag"
            ls -la android/dist
            exit 0
          fi
        done
        echo "::warning::No release carries $apk and there's no ANDROID_KEYSTORE secret: building without the full Android app"
