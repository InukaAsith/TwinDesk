<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../"><!-- multi-device: this page is windows/mesh/app.html; everything else loads from windows/ -->

  <title>TwinDesk</title>
  <link rel="stylesheet" href="mesh/app.css">

<body>
  <nav id="sidebar" aria-label="Sections">
    <div class="identity">
      <div class="app-mark" aria-hidden="true"></div>
      <div class="who">
        <div class="app-name">TwinDesk<span class="mesh-pill" title="Multi-device is on: Mesh mode, in beta">MESH <span>beta</span></span></div>
        <div class="peer"><span id="peer-dot" class="dot"></span><span id="peer-text">Not paired</span></div>
      </div>
    </div>
    <div id="side-scroll">
      <div id="phones"></div>
      <ul id="nav" role="tablist"></ul>
    </div>
  </nav>

  <main id="content">
    <section id="banner" class="banner" hidden>
      <div class="banner-text">
        <div><strong id="pair-title">Pairing</strong></div>
        <div id="pair-code-wrap"><span class="code-label">Code</span> <span id="pair-code" class="code"></span></div>
        <div id="pair-hint" class="hint"></div>
      </div>
      <div class="banner-actions">
        <button id="pair-match" class="btn primary">Codes match</button>
        <button id="pair-cancel" class="btn">Cancel</button>
      </div>
    </section>
    <div id="pages"></div>
  </main>

  <script src="../shared/protocol.js"></script>

  <script src="ui-mount.js"></script>
  <script src="ui-terminal.js"></script>
  <script src="../shared/ui-nowplaying.js"></script>
  <script src="ui-audio.js"></script>
  <script src="ui-apps.js"></script>
  <script src="mesh/ui-phone.js"></script>
  <script src="../shared/ui-device.js"></script>

  <script src="ui-about.js"></script>

  <script src="../shared/ui-messages.js"></script>
  <script src="../shared/ui-media.js"></script>

  <script src="../shared/sidebar-model.js"></script>
  <script src="mesh/app.js"></script>
