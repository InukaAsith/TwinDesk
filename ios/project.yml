# TwinDesk for iPhone and iPad. The Xcode project is generated from this file (XcodeGen), so it
# never has to be opened in Xcode: `xcodegen generate` then `./build.sh` (or the Build iOS workflow).
name: TwinDesk
options:
  bundleIdPrefix: com.twindesk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TwinDesk:
    type: application
    platform: iOS
    sources:
      - path: TwinDesk
        excludes: ["WebIOS/**"]
      # The Android app's pages (the computer's screen, the Remote, its sound), as they are: "web".
      - path: ../android/app/src/main/assets/web
        type: folder
        buildPhase: resources
      # This app's own pages (the camera): "WebIOS".
      - path: TwinDesk/WebIOS
        type: folder
        buildPhase: resources
    dependencies:
      - target: Broadcast
        embed: true
      - target: Share
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twindesk.ios
        INFOPLIST_FILE: TwinDesk/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
  # Share Screen: the ReplayKit broadcast extension (Broadcast/SampleHandler.swift).
  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      # The app's language (no shared app group, so they follow the iPhone's language).
      - path: TwinDesk/Core/I18n.swift
      - path: TwinDesk/Lang
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twindesk.ios.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
  # Send to Computer in the share sheet (Share/ShareViewController.swift): the items go to the app
  # on 127.0.0.1, which sends them over its session.
  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      # The app's language (no shared app group, so they follow the iPhone's language).
      - path: TwinDesk/Core/I18n.swift
      - path: TwinDesk/Lang
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twindesk.ios.share
        INFOPLIST_FILE: Share/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
